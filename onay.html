<!doctype html>
<!-- © 2026 OKT Trailer. Tüm hakları saklıdır. İzinsiz kopyalanamaz. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>OKT · Erişim onayı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1B1C20;font-family:Barlow,Arial,sans-serif;color:#1B1C20;padding:20px}
.box{position:relative;background:#fff;width:min(520px,100%);padding:34px 32px 28px}
.box:before,.box:after{content:"";position:absolute;width:24px;height:24px;border:3px solid #D0112B}
.box:before{top:0;left:0;border-right:0;border-bottom:0}.box:after{bottom:0;right:0;border-left:0;border-top:0}
.brand{font:700 15px "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:2px;color:#646973;text-transform:uppercase}
h1{font:700 34px/1.05 "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;margin:6px 0 18px}
.who{background:#F6F7F8;border-left:4px solid #D0112B;padding:14px 16px;margin-bottom:22px;line-height:1.6}
.who b{font-size:18px}.who span{display:block;color:#4f5560;font-size:14px}
.row{display:flex;gap:10px}
button{flex:1;border:0;border-radius:4px;padding:16px;font:700 17px Barlow,Arial,sans-serif;cursor:pointer}
.ok{background:#D0112B;color:#fff}.ok:hover{background:#B00E24}
.no{background:#fff;color:#1B1C20;border:1px solid #c9ccd2}
button:disabled{opacity:.5;cursor:wait}
.msg{margin-top:16px;font-size:15px;line-height:1.5;min-height:22px}
.done{text-align:center;padding:10px 0}.done .ic{font-size:54px;line-height:1}
.foot{margin-top:22px;font-size:11.5px;color:#8a8f98;text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="brand">OKT Trailer · Ürün Konfigüratörü</div>
  <h1>Erişim onayı</h1>
  <div id="main">
    <div class="who" id="who"></div>
    <div class="row"><button class="ok" id="ok">✅ Onayla, girsin</button><button class="no" id="no">Reddet</button></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="foot">© 2026 OKT Trailer · Bu sayfa yalnızca onay mailindeki link ile çalışır.</div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search),t=q.get("t")||"",k=q.get("k")||"";
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  var main=document.getElementById("main"),msg=document.getElementById("msg");
  if(!/^okt-onay-[a-z0-9]{16,}$/.test(t)||!/^[a-f0-9]{32}$/.test(k)){main.innerHTML='<div class="msg">Bu onay linki geçersiz ya da eksik. Lütfen onay mailindeki linki kullanın.</div>';return}
  document.getElementById("who").innerHTML="<b>"+esc(q.get("ad")||"Müşteri")+"</b>"+(q.get("f")?"<span>"+esc(q.get("f"))+"</span>":"")+(q.get("e")?"<span>"+esc(q.get("e"))+"</span>":"")+(q.get("tel")?"<span>"+esc(q.get("tel"))+"</span>":"");
  async function send(kind){
    var b1=document.getElementById("ok"),b2=document.getElementById("no");b1.disabled=b2.disabled=true;msg.style.color="#646973";msg.textContent="Gönderiliyor…";
    try{
      var r=await fetch("https://ntfy.sh/"+encodeURIComponent(t),{method:"POST",body:(kind==="ok"?"approve:":"reject:")+k});
      if(!r.ok)throw new Error("HTTP "+r.status);
      main.innerHTML=kind==="ok"
        ?'<div class="done"><div class="ic">✅</div><h1 style="margin:10px 0 6px">Onaylandı</h1><div class="msg">'+esc(q.get("ad")||"Müşteri")+' şimdi konfigüratöre girebilir. Bekleme ekranı açıksa birkaç saniye içinde kendiliğinden açılır; kapattıysa tekrar "Giriş yap"a basması yeterli.</div></div>'
        :'<div class="done"><div class="ic">⛔</div><h1 style="margin:10px 0 6px">Reddedildi</h1><div class="msg">Müşteriye talebinin onaylanmadığı bildirildi.</div></div>';
    }catch(e){b1.disabled=b2.disabled=false;msg.style.color="#D0112B";msg.textContent="Gönderilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.";}
  }
  document.getElementById("ok").onclick=function(){send("ok")};
  document.getElementById("no").onclick=function(){send("no")};
})();
</script>
</body>
</html>
